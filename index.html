<!DOCTYPE html>
<html>
<head>
<title>Fruit Slot</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{
 margin:0;background:#071321;display:flex;
 justify-content:center;align-items:center;min-height:100vh
}
.game{
 width:480px;padding:20px;border-radius:25px;
 background:#35bdd8;border:6px solid #087f9e;
 text-align:center;color:white
}
h1{margin:5px 0 15px}
.reels{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;background:#159abd;padding:10px;border-radius:18px
}
.reel{
 height:300px;background:white;border-radius:10px;
 overflow:hidden;color:#111
}
.strip{width:100%}
.symbol{
 height:100px;display:flex;justify-content:center;
 align-items:center;font-size:65px;border-bottom:1px dashed #ddd
}
.stats{
 margin:15px 0;padding:12px;background:#111c2d;
 border-radius:15px;display:flex;justify-content:space-around
}
.stats b{display:block;margin-top:5px}
#win{color:#30df88}
.bet{
 display:flex;justify-content:center;align-items:center;
 gap:15px;margin:10px
}
button{
 border:0;border-radius:10px;padding:8px 15px;
 cursor:pointer;font-weight:bold;background:#087f9e;color:white
}
.bet button{font-size:20px;width:40px}
#spin{
 width:100%;height:50px;background:#25bd20;
 font-size:22px
}
#spin:disabled{background:#888}
#msg{height:25px;color:#ffd52f;font-weight:bold}
</style>
</head>

<body>

<div class="game">
<h1>🍊 FRUIT SLOT 🍉</h1>

<div class="reels">
 <div class="reel"><div class="strip" id="r0"></div></div>
 <div class="reel"><div class="strip" id="r1"></div></div>
 <div class="reel"><div class="strip" id="r2"></div></div>
</div>

<div class="stats">
 <div>BALANCE<b id="bal">$1000</b></div>
 <div>WIN<b id="win">$0</b></div>
 <div>BET<b id="bet">$10</b></div>
</div>

<div class="bet">
 <button onclick="changeBet(-5)">−</button>
 <b>BET</b>
 <button onclick="changeBet(5)">+</button>
</div>

<div id="msg">SET BET & SPIN!</div>
<button id="spin" onclick="spin()">SPIN</button>
</div>

<script>
const fruits=[
 ["🍊",10],["🍒",15],["7️⃣",10],
 ["🍉",15],["🍋",10],["🍆",10]
];

let balance=1000,bet=10,busy=false,state=[];

function rand(){
 return fruits[Math.floor(Math.random()*fruits.length)];
}

function show(id,list){
 document.getElementById(id).innerHTML=
 list.map(x=><div class="symbol">${x[0]}</div>).join("");
}

function init(){
 for(let i=0;i<3;i++){
  state[i]=[rand(),rand(),rand()];
  show("r"+i,state[i]);
 }
}

function spin(){
 if(busy)return;

 if(balance<bet){
  msg.innerText="NOT ENOUGH BALANCE";
  return;
 }

 busy=true;
 spinBtn.disabled=true;
 balance-=bet;
 bal.innerText="$"+balance;
 win.innerText="$0";
 msg.innerText="SPINNING...";

 for(let i=0;i<3;i++){
  setTimeout(()=>{
   state[i]=[rand(),rand(),rand()];
   show("r"+i,state[i]);

   if(i==2) checkWin();
  },800+i*400);
 }
}

function checkWin(){
 let prize=0;

 for(let row=0;row<3;row++){
  if(
   state[0][row][0]==state[1][row][0] &&
   state[1][row][0]==state[2][row][0]
  ){
   prize+=bet*state[0][row][1];
  }
 }

 balance+=prize;
 win.innerText="$"+prize;
 bal.innerText="$"+balance;
 msg.innerText=prize?"🎉 YOU WIN!":"TRY AGAIN!";
 busy=false;
 spinBtn.disabled=false;
}

function changeBet(n){
 if(busy)return;
 bet=Math.max(5,Math.min(100,bet+n));
 document.getElementById("bet").innerText="$"+bet;
}

const bal=document.getElementById("bal");
const win=document.getElementById("win");
const msg=document.getElementById("msg");
const spinBtn=document.getElementById("spin");

init();
</script>

</body>
</html>
